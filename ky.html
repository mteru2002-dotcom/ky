<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>KY活動表 手書き版</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap">
<style>
/* Layout: 固定ツールバー + A4横の用紙1枚。欄をタップすると拡大パッドが開き、そこに手書きする */
:root{
  --bg:#e9ebe6; --fg:#1d2124; --bar:#23282c; --bar-fg:#f2f2ee; --muted:#7d868c;
  --accent:#f5c518; --accent-fg:#1d2124; --paper-shadow:rgba(20,25,30,.18); --danger:#c8372d;
  --pad-bg:#d9dcd5; --hl:rgba(245,197,24,.28);
  --font:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#15181a;--fg:#e8eae6;--bar:#0d0f10;--paper-shadow:rgba(0,0,0,.6);--pad-bg:#202427;--muted:#8f989e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15181a;--fg:#e8eae6;--bar:#0d0f10;--paper-shadow:rgba(0,0,0,.6);--pad-bg:#202427;--muted:#8f989e;color-scheme:dark}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font)}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--bar);color:var(--bar-fg);
  padding-block:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));
  display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;border-bottom:3px solid var(--accent)}
.grp{display:flex;gap:4px;align-items:center}
.sep{width:1px;height:28px;background:#4a5257}
.bar button,.padhead button{font:inherit;font-size:13.5px;min-height:40px;min-width:42px;padding:0 9px;border-radius:8px;border:1px solid #4a5257;
  background:#30373c;color:var(--bar-fg);cursor:pointer;touch-action:manipulation}
.bar button:focus-visible,.padhead button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:700}
.bar button:disabled,.padhead button:disabled{opacity:.4}
.datepick{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--bar-fg);background:#30373c;border:1px solid #4a5257;border-radius:8px;min-height:40px;padding:0 4px 0 10px}
.dwrap{position:relative;display:inline-block}
.datepick input{font:inherit;font-size:14px;height:32px;min-width:150px;box-sizing:border-box;-webkit-appearance:none;appearance:none;display:block;border-radius:6px;border:0;padding:0 8px;background:#fff;color:#111;color-scheme:light}
.datepick input::-webkit-date-and-time-value{text-align:left}
#datePick.empty,#datePick.empty::-webkit-datetime-edit{color:transparent}
#dateEmpty{position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:13px;color:#7d868c;pointer-events:none}
.dot{display:inline-block;width:18px;height:18px;border-radius:50%;vertical-align:middle;border:2px solid #fff3}
.w{display:inline-block;background:currentColor;border-radius:4px;width:22px;vertical-align:middle}
.brand{font-weight:700;letter-spacing:.04em;margin-right:4px;white-space:nowrap}
.status{max-width:1600px;margin:0 auto 6px;min-height:16px;font-size:12px;color:var(--muted);text-align:right}
.wrap{padding-block:14px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet{position:relative;width:100%;max-width:1600px;margin:0 auto;aspect-ratio:842/595;background:#fff;box-shadow:0 2px 14px var(--paper-shadow)}
.sheet img{position:absolute;inset:0;width:100%;height:100%;max-width:none;pointer-events:none}
#ink{position:absolute;inset:0;width:100%;height:100%;touch-action:pan-x pan-y pinch-zoom}
#hl{position:absolute;background:var(--hl);outline:2px solid var(--accent);pointer-events:none;transition:opacity .25s}
body.eraser canvas{cursor:cell}
.hint{max-width:1600px;margin:10px auto 0;font-size:12.5px;color:var(--muted);line-height:1.7}

/* 拡大パッド */
.pad{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--pad-bg);display:flex;flex-direction:column;
  padding-block:10px max(12px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.padhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.padhead h2{margin:0;font-size:17px;font-weight:700;color:var(--fg);margin-right:auto;min-width:0}
.padhead h2 small{display:block;font-size:12px;font-weight:400;color:var(--muted)}
.padhead .undo1{background:#fff;color:#1d2124;border:2px solid #23282c;font-weight:700;min-width:104px}
.padhead .undo1:disabled{opacity:.35}
.padhead #newBtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:700}
.padhead .done{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:700;min-width:84px}
.padbody{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.padbody.scroll{justify-content:flex-start;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-block:6px}
.padbody.scroll #padCv{max-width:none;flex:none;margin-inline:4px}
.scrollhint{font-size:12.5px;color:var(--muted);margin:6px 0 0}
#padCv{background:#fff;box-shadow:0 2px 12px var(--paper-shadow);outline:3px solid #23282c;touch-action:none;max-width:100%}

.kpanel{position:fixed;left:0;right:0;z-index:6;background:var(--pad-bg);box-shadow:0 6px 18px var(--paper-shadow);
  padding-block:10px 14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.kpanel .padhead{margin-bottom:8px}
#kBody textarea,#kBody input{width:100%;box-sizing:border-box;font:inherit;font-size:20px;line-height:1.4;padding:10px 12px;border-radius:8px;border:2px solid #23282c;background:#fff;color:#111;-webkit-user-select:text;user-select:text}
#kBody textarea{min-height:88px;resize:vertical}
#kBody textarea:focus,#kBody input:focus{outline:3px solid var(--accent);outline-offset:1px}
.opts{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.opts+.opts{margin-top:10px}
.opts .lbl{min-width:52px;font-weight:700;color:var(--fg)}
.opt{font:inherit;min-width:76px;min-height:56px;padding:0 14px;font-size:24px;border-radius:10px;border:2px solid #7d868c;background:#fff;color:#111;cursor:pointer;touch-action:manipulation}
.opt[aria-pressed="true"]{background:var(--accent);border-color:#23282c;font-weight:700}
.opt.small{font-size:16px;min-width:0}
.khint{font-size:12.5px;color:var(--muted);margin:8px 0 0}
#hl.keep{transition:none}
.confirm{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:20;
  background:var(--bar);color:var(--bar-fg);border:2px solid var(--danger);border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;max-width:calc(100% - 32px)}
.confirm button{font:inherit;min-height:40px;padding:0 14px;border-radius:8px;border:1px solid #4a5257;background:#30373c;color:var(--bar-fg)}
.confirm .yes{background:var(--danger);border-color:var(--danger);color:#fff;font-weight:700}
.modal{position:fixed;inset:0;z-index:30;background:rgba(10,12,14,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal img{max-height:72vh;max-width:100%;background:#fff;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
.modal p{color:#f2f2ee;margin:0;font-size:14px;text-align:center}
.modal .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.modal button{font:inherit;min-height:44px;padding:0 18px;border-radius:8px;border:0;background:var(--accent);color:var(--accent-fg);font-weight:700}
.modal button.sec{background:#30373c;color:#f2f2ee}
#printImg{display:none}
@media print{
  @page{size:A4 landscape;margin:0}
  body *{visibility:hidden}
  #printImg,#printImg *{visibility:visible}
  #printImg{display:block;position:fixed;inset:0;width:297mm;height:210mm}
  body::before{display:none}
}
</style>

</head>
<body>
<div class="bar" id="bar" role="toolbar" aria-label="手書きツール">
  <span class="brand">KY活動表 <span id="modeName">手書き版</span></span>
  <div class="grp" aria-label="ペンの色">
    <button id="c-black" data-color="#111111" aria-pressed="true" title="黒"><span class="dot" style="background:#111"></span></button>
    <button id="c-red" data-color="#d22b20" aria-pressed="false" title="赤"><span class="dot" style="background:#d22b20"></span></button>
    <button id="c-blue" data-color="#1f4fd1" aria-pressed="false" title="青"><span class="dot" style="background:#1f4fd1"></span></button>
  </div>
  <div class="grp" aria-label="太さ">
    <button id="w1" data-w="0.45" aria-pressed="false" title="細"><span class="w" style="height:2px"></span></button>
    <button id="w2" data-w="0.75" aria-pressed="true" title="中"><span class="w" style="height:4px"></span></button>
    <button id="w3" data-w="1.2" aria-pressed="false" title="太"><span class="w" style="height:7px"></span></button>
  </div>
  <span class="sep"></span>
  <div class="grp">
    <button id="eraser" aria-pressed="false">消しゴム</button>
    <button id="undo" disabled>↶ 戻す</button>
    <button id="redo" disabled>↷ やり直し</button>
  </div>
  <span class="sep sheetOnly"></span>
  <div class="grp sheetOnly">
    <button id="today">今日の日付</button>
    <label class="datepick" title="カレンダーから日付を選ぶ">日付<span class="dwrap"><input type="date" id="datePick"><span id="dateEmpty">タップして選択</span></span></label>
    <button id="clearDate">日付を消す</button>
    <button id="direct" aria-pressed="false" title="オンにすると拡大せず用紙に直接書きます">直接書く</button>
  </div>
  <span class="sep sheetOnly"></span>
  <div class="grp sheetOnly">
    <button id="save">PDFで保存</button>
    <button id="clear">新しい用紙</button>
  </div>
</div>

<div class="wrap">
  <div class="status" id="status"></div>
  <div class="sheet" id="sheet">
    <canvas id="ink"></canvas>
    <div id="hl" hidden></div>
  </div>
  <p class="hint" id="hint">手書きで記入する欄をタップすると、その欄が大きく開きます。昼・夜や健康状態チェックの 良-不、点検・確認の □ も拡大して ○ や ✓ を手書きできます。日付は「今日の日付」で入ります。「次へ」で次の欄に進めます。記入内容はこの端末に自動で保存されます。</p>
</div>

<section class="pad" id="pad" hidden aria-label="拡大記入">
  <div class="padhead">
    <h2 id="padTitle">欄</h2>
    <button id="newBtn" aria-pressed="false" hidden>新規入場者（番号に○）</button>
    <button id="padUndo" class="undo1" disabled>↶ 1つ戻す</button>
    <button id="prevF">◀ 前へ</button>
    <button id="nextF">次へ ▶</button>
    <button id="clearF">この欄を消す</button>
    <button class="done" id="doneF">完了</button>
  </div>
  <div class="padbody" id="padBody"><canvas id="padCv"></canvas></div>
  <p class="scrollhint" id="scrollHint" hidden>横長の欄です。書き進めたら指で左へスクロールしてください。</p>
</section>

<section class="kpanel" id="kpanel" hidden aria-label="入力">
  <div class="padhead">
    <h2 id="kTitle">欄</h2>
    <button id="kPrev">◀ 前へ</button>
    <button id="kNext">次へ ▶</button>
    <button id="kClear">消す</button>
    <button class="done" id="kDone">完了</button>
  </div>
  <div id="kBody"></div>
</section>

<div class="confirm" id="confirm" hidden>
  <span>記入をすべて消して新しい用紙にしますか？</span>
  <button class="yes" id="confirmYes">消して新しくする</button>
  <button id="confirmNo">やめる</button>
</div>

<div class="modal" id="modal" hidden>
  <img id="outImg" alt="保存用の画像">
  <p id="modalMsg">画像を長押しして「写真に追加」または「共有」で保存できます。</p>
  <div class="row">
    <button id="shareBtn" hidden>共有・ファイルに保存</button>
    <button class="sec" id="closeModal">閉じる</button>
  </div>
</div>
<img id="printImg" alt="">

function cw(c,ch,f){const k=f+'|'+ch;let v=wcache.get(k);if(v===undefined){c.font=f;v=c.measureText(ch).width;wcache.set(k,v);}return v;}
const fontOf=r=>`${r.b?700:400} ${r.s}px ${FF}`;
const KIN='ぁぃぅぇぉっゃゅょゎァィゥェォッャュョヮヵヶー、。，．）」』】！？・：ｧｨｩｪｫｯｬｭｮｰ';
const isSp=ch=>ch===' '||ch==='　';
function layoutText(c,cell){
  // 文字を1字ずつ（フォント付き）に展開
  const chars=[];for(const [t,r] of cell.runs){const fo=fontOf(r);for(const ch of t)chars.push({ch,f:fo,s:r.s,col:r.c});}
  for(const o of chars)o.w=cw(c,o.ch,o.f);
  const pad=1.2, bw=cell.x1-cell.x0-pad*2;
  let lines=[];
  if(cell.w){let cur=[],w=0;
    // 全角スペースが2つ以上続く所はExcelで改行させている所なので、そこで改行する
    for(let i=0;i<chars.length;i++){const o=chars[i];
      if(o.ch==='\n'){lines.push(cur);cur=[];w=0;continue;}
      if(isSp(o.ch)&&i+1<chars.length&&isSp(chars[i+1].ch)&&cur.length){lines.push(cur);cur=[];w=0;while(i+1<chars.length&&isSp(chars[i+1].ch))i++;continue;}
      if(w+o.w>bw&&cur.length){
        let carry=[];
        // 行頭禁則（小さい字・句読点は行頭に来ないよう前の字ごと送る）
        if(KIN.includes(o.ch)&&cur.length>1)carry=[cur.pop()];
        lines.push(cur);cur=carry;w=carry.reduce((a,q)=>a+q.w,0);if(isSp(o.ch)&&!carry.length)continue;}
      cur.push(o);w+=o.w;}
    lines.push(cur);
    lines=lines.map(l=>{let a=0,b=l.length;while(a<b&&isSp(l[a].ch))a++;while(b>a&&isSp(l[b-1].ch))b--;return l.slice(a,b);}).filter(l=>l.length);
  }else lines=[chars];
  return {lines,bw,pad};
}
function drawCell(c,cell,soft){
  if(cell.rot===255){ // 縦書き（1字ずつ縦に並べる）
    const chars=[];for(const [t,r] of cell.runs)for(const ch of t)chars.push({ch,f:fontOf(r),s:r.s});
    const lh=chars.reduce((m,o)=>Math.max(m,o.s),0)*1.05, total=lh*chars.length;
    let y=(cell.y0+cell.y1)/2-total/2+lh*0.86;const cx=(cell.x0+cell.x1)/2;
    c.fillStyle=soft?'#4a5359':'#111';c.textAlign='center';for(const o of chars){c.font=o.f;c.fillText(o.ch,cx,y);y+=lh;}c.textAlign='left';return;
  }
  const {lines,bw,pad}=layoutText(c,cell);
  const lw=lines.map(l=>l.reduce((a,o)=>a+o.w,0));
  const maxW=Math.max(...lw,0);
  const spill=!cell.m&&!cell.w&&!cell.sh;
  let hs=1; if(!spill&&maxW>bw)hs=bw/maxW;
  const lh=lines.map(l=>l.reduce((m,o)=>Math.max(m,o.s),0)*1.22);
  let th=lh.reduce((a,b)=>a+b,0), bh=cell.y1-cell.y0-1, vs=1;
  if(th>bh){vs=bh/th;th=bh;}
  let y=cell.v===0?cell.y0+1:cell.v===2?cell.y1-1-th:(cell.y0+cell.y1)/2-th/2;
  lines.forEach((l,i)=>{
    const w=lw[i]*hs, h=lh[i]*vs;
    let x=cell.h===2?(cell.x0+cell.x1)/2-w/2:cell.h===3?cell.x1-pad-w:cell.x0+pad+(cell.ind||0)*3;
    const base=y+h*0.82;
    c.save();c.translate(x,base);c.scale(hs*vs,vs);
    const cpl=CP[cell.r+','+cell.c]||(CP[cell.r+','+cell.c]=[]);if(i===0)cpl.length=0;
    let cx=0;for(const o of l){c.font=o.f;cpl.push({ch:o.ch,x:x+(cx+o.w/2)*hs*vs,y:base-o.s*vs*0.36,s:o.s*vs});
      if(o.ch==='□'){c.fillStyle='#fff';c.fillRect(cx+o.w*0.08,-o.s*0.8,o.w*0.84,o.s*0.84);}
      c.fillStyle=soft?'#4a5359':(o.col||'#111');c.fillText(o.ch,cx,0);
      if(cell.r===0&&cell.c===22&&'年月日（）'.includes(o.ch)){MARK[o.ch]=[x+cx*hs*vs,x+(cx+o.w)*hs*vs];MARK.base=base;MARK.size=o.s*vs;}
      cx+=o.w;}
    c.restore(); y+=h;
  });
}
function drawArrow(c){ // ワンポイント前の矢印（Excelの図形）
  const x0=525.8,x1=568.2,y0=115.7,y1=131.3,ym=(y0+y1)/2,hx=x1-9.5;
  c.beginPath();c.moveTo(x0,ym-3.2);c.lineTo(hx,ym-3.2);c.lineTo(hx,y0);c.lineTo(x1,ym);c.lineTo(hx,y1);c.lineTo(hx,ym+3.2);c.lineTo(x0,ym+3.2);c.closePath();c.fill();
}
function drawForm(c,r,soft){
  c.save();
  if(r){c.beginPath();c.rect(r.x0,r.y0,r.x1-r.x0,r.y1-r.y0);c.clip();}
  // 手書き欄以外のセルを着色し、手書き欄は白く抜く
  c.fillStyle=soft?'#e3eaf1':TINT;
  for(const [a,b] of [[1,17],[18,25],[25,32]])c.fillRect(XS[0],YS[a],XS[30]-XS[0],YS[b]-YS[a]);
  c.fillStyle='#fff';
  for(const fd of F)for(const [x0,y0,x1,y1] of fd.white)c.fillRect(x0,y0,x1-x0,y1-y0);
  c.lineCap='butt';
  for(const [x0,y0,x1,y1,st] of LAY.lines){
    if(r&&(Math.max(x0,x1)<r.x0-2||Math.min(x0,x1)>r.x1+2||Math.max(y0,y1)<r.y0-2||Math.min(y0,y1)>r.y1+2))continue;
    c.strokeStyle=soft?'#aab3b8':'#111';c.lineWidth=soft?Math.min(LW[st]||0.5,0.6):(LW[st]||0.5);
    c.setLineDash(st===3?[2,1]:st===4?[0.6,0.8]:[]);
    c.beginPath();c.moveTo(x0,y0);c.lineTo(x1,y1);c.stroke();
  }
  c.setLineDash([]);c.textBaseline='alphabetic';c.textAlign='left';c.fillStyle=soft?'#4a5359':'#111';
  for(const cell of LAY.cells){
    if(r&&(cell.x1<r.x0-60||cell.x0>r.x1+60||cell.y1<r.y0||cell.y0>r.y1))continue;
    drawCell(c,cell,soft);
  }
  c.fillStyle=soft?'#4a5359':'#111';drawArrow(c);
  c.restore();
}

/* ---------- 入力（共通） ---------- */
let penSeen=false;
function eraseAt(x,y,r){
  let hit=false;
  strokes=strokes.filter(st=>{for(const q of st.p){if(Math.abs(q[0]-x)<r&&Math.abs(q[1]-y)<r&&Math.hypot(q[0]-x,q[1]-y)<r){hit=true;return false;}}return true;});
  if(hit)redrawAll(); return hit;
}
function attach(el,toPt,canDraw,getCur,setCur,ctxFn,eraseR){
  let active=null, prevSnap=null, erased=false;
  el.addEventListener('pointerdown',e=>{
    if(e.pointerType==='pen'&&!penSeen){penSeen=true;pcv.style.touchAction='pan-x';}
    if(!canDraw(e)||active!==null)return;
    e.preventDefault();active=e.pointerId;try{el.setPointerCapture(e.pointerId);}catch(_){}
    const p=toPt(e);
    if(eraser){prevSnap=snap();erased=eraseAt(p[0],p[1],eraseR());return;}
    setCur({c:color,w:width,p:[p]});redrawAll();
  });
  el.addEventListener('pointermove',e=>{
    if(e.pointerId!==active)return;e.preventDefault();
    const evs=(e.getCoalescedEvents&&e.getCoalescedEvents())||[];
    const cur=getCur();
    for(const ev of (evs.length?evs:[e])){
      const p=toPt(ev);
      if(eraser){erased=eraseAt(p[0],p[1],eraseR())||erased;continue;}
      const l=cur.p[cur.p.length-1];if(Math.hypot(p[0]-l[0],p[1]-l[1])<0.08)continue;
      cur.p.push(p);
    }
    if(!eraser){const c=ctxFn(),n=cur.p.length;drawStroke(c,{c:cur.c,w:cur.w,p:cur.p.slice(Math.max(0,n-3))});}
  });
  const end=e=>{
    if(e.pointerId!==active)return;active=null;
    if(eraser){if(erased)commit(prevSnap);prevSnap=null;erased=false;return;}
    const cur=getCur();
    if(cur){const prev=snap();cur.p=cur.p.map(q=>[+q[0].toFixed(2),+q[1].toFixed(2),+q[2].toFixed(2)]);strokes.push(cur);setCur(null);commit(prev);redrawAll();}
  };
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
  const stop=e=>{for(const t of e.touches){if(t.touchType==='stylus'){e.preventDefault();return;}}};
  el.addEventListener('touchstart',stop,{passive:false});el.addEventListener('touchmove',stop,{passive:false});
}
const press3=e=>e.pointerType==='pen'?(e.pressure||0.5):0.5;

    const n=i+1,hc=c===0?7:22,oc=c===0?10:25,end=c===0?15:30;
    k({key:'name'+n,name:`${n} 氏名`,sub:'自筆でサイン（手書き）',type:'hand',newKey:'new'+n,numCell:`${r},${c}`,rect:R(r,c,r+1,hc)});
    k({key:'health'+n,name:`${n} 健康状態チェック`,sub:'AM・PM それぞれ 良 か 不',type:'health',cells:[`${r},${hc+1}`,`${r},${hc+2}`],rect:R(r,hc,r+1,oc)});
    k({key:'sp'+n,name:`${n} 安全ワンポイント`,type:'text',rect:R(r,oc,r+1,end)});
  });
  const SC=['✓','✕','/'];
  [['部材の変形','28,0',R(27,0,29,5)],['作業床の段差、間隙の有無','28,5',R(27,5,29,12)],['筋交いなどの部材の未復旧','28,12',R(27,12,29,19)],['ネット等のバタつきの有無','28,19',R(27,19,29,30)]]
    .forEach(([n,cell,rect],i)=>k({key:'sc'+i,name:'足場の始業前点検：'+n,sub:'□ に手書きで ✓ 良好／✕ 不備がある／/ 該当しない',type:'hand',rect}));
  [['当日作業の筋交いなどの部材の未復旧','30,10',R(30,10,31,19)],['片付け状況の確認','30,19',R(30,19,31,30)],['当日の残作業の数量','31,0',R(31,0,32,6)],['翌日作業内容の確認','31,6',R(31,6,32,12)],['作業場内の残火等の確認','31,12',R(31,12,32,19)],['健康状態の確認','31,19',R(31,19,32,30)]]
    .forEach(([n,cell,rect],i)=>k({key:'ec'+i,name:'作業終了時の確認：'+n,sub:'確認したら □ に手書きで ✓',type:'hand',rect}));
}
function drawNew(c){
  const list=MODE==='key'?KF:F;
  for(const f of list){if(!f.newKey||!vals[f.newKey])continue;const ps=CP[f.numCell]||[];
    if(ps.length){const x=ps.reduce((a,p)=>a+p.x,0)/ps.length,s=ps[0].s;ellipse(c,x,ps[0].y,s*0.45*ps.length+s*0.35,s*0.75);}}
}
function findK(x,y){let best=-1,ba=1e9;KF.forEach((f,i)=>{const r=f.rect;if(x>=r.x0&&x<=r.x1&&y>=r.y0&&y<=r.y1){const a=(r.x1-r.x0)*(r.y1-r.y0);if(a<ba){ba=a;best=i;}}});return best;}

/* 入力値を用紙に描く */
const INK='#111';
function ellipse(c,x,y,rx,ry){c.save();c.strokeStyle=INK;c.lineWidth=0.7;c.beginPath();c.ellipse(x,y,rx,ry,0,0,Math.PI*2);c.stroke();c.restore();}
function wrapText(c,str,fs,bw){
  c.font=`${fs}px ${FF}`;const out=[];
  for(const para of str.split('\n')){let line='',w=0;
    for(const ch of para){const cw2=c.measureText(ch).width;if(w+cw2>bw&&line){out.push(line);line='';w=0;}line+=ch;w+=cw2;}
    out.push(line);}
  return out;
}
function drawTextBox(c,b,str,align){
  if(!str)return;const bw=b.x1-b.x0,bh=b.y1-b.y0;
  let fs=Math.min(bh*0.62,11),lines;
  for(let it=0;it<40;it++){lines=wrapText(c,str,fs,bw);if(lines.length*fs*1.2<=bh||fs<3)break;fs*=0.93;}
  c.save();c.fillStyle=INK;c.font=`${fs}px ${FF}`;c.textBaseline='middle';c.textAlign=align==='right'?'right':'left';
  const lh=fs*1.2;let y=(b.y0+b.y1)/2-lh*lines.length/2+lh/2;
  for(const l of lines){c.fillText(l,align==='right'?b.x1:b.x0,y);y+=lh;}
  c.restore();
}
function charIn(cell,ch){return (CP[cell]||[]).find(p=>p.ch===ch);}
function drawVals(c){
  for(const f of KF){const v=vals[f.key];
    if(f.type==='hand')continue;
    if(v===undefined||v===''||v===null)continue;
    const r=f.rect;
    if(f.type==='text'){const x0=f.left||r.x0+1.8;drawTextBox(c,{x0,y0:r.y0+(f.top||0.8),x1:r.x1-1.8,y1:r.y1-0.8},String(v),f.align);}
    else if(f.type==='choice'){const p=charIn(f.cell,v);if(p)ellipse(c,p.x,p.y,p.s*0.78,p.s*0.72);}
    else if(f.type==='risk'){const s=Math.min((r.y1-r.y0)*0.62,(r.x1-r.x0)*0.6);c.save();c.fillStyle=INK;c.font=`700 ${s}px ${FF}`;c.textAlign='center';c.textBaseline='middle';c.fillText(v,(r.x0+r.x1)/2,(r.y0+r.y1)/2);c.restore();}
    else if(f.type==='health'){['am','pm'].forEach((t,j)=>{if(v[t]){const p=charIn(f.cells[j],v[t]);if(p)ellipse(c,p.x,p.y,p.s*0.68,p.s*0.66);}});}
    else if(f.type==='check'){const p=charIn(f.cell,'□');if(p){c.save();c.fillStyle=INK;c.font=`700 ${p.s*1.35}px ${FF}`;c.textAlign='center';c.textBaseline='middle';c.fillText(v,p.x+p.s*0.08,p.y-p.s*0.12);c.restore();}}
  }
}

/* 入力パネル */
function showHL(r){const h=$('hl');h.classList.add('keep');h.hidden=false;h.style.opacity='1';
  Object.assign(h.style,{left:r.x0/W*100+'%',top:r.y0/H*100+'%',width:(r.x1-r.x0)/W*100+'%',height:(r.y1-r.y0)/H*100+'%'});}
function hideHL(){const h=$('hl');h.classList.remove('keep');h.hidden=true;}
function kcommit(){if(kPrev&&JSON.stringify(kPrev.vals)!==JSON.stringify(vals)||kPrev&&kPrev.dateText!==dateText){commit(kPrev);}kPrev=null;}
function setVal(key,v){if(v===undefined||v===''||v===null)delete vals[key];else vals[key]=v;redrawSheet();save();}
function openK(i){
  kcommit();
  if(i<0||i>=KF.length)return;
  kcur=i;const f=KF[i];
  if(f.type==='hand'){
    kpanel.hidden=true;showHL(f.rect);
    const m=0.6;openField(-1,{x0:f.rect.x0+m,y0:f.rect.y0+m,x1:f.rect.x1-m,y1:f.rect.y1-m,custom:true});
    $('padTitle').innerHTML=`${f.name}<small>${f.sub||''}</small>`;
    $('prevF').disabled=i<=0;$('nextF').disabled=i>=KF.length-1;
    const nb=$('newBtn');nb.hidden=!f.newKey;if(f.newKey)nb.setAttribute('aria-pressed',!!vals[f.newKey]);
    return;
  }
  if(!pad.hidden){pad.hidden=true;curPad=null;document.body.style.overflow='';}
  kPrev=snap();
  kpanel.hidden=false;document.querySelectorAll('.sheetOnly').forEach(e=>e.style.visibility='hidden');
  kpanel.style.top=$('bar').getBoundingClientRect().bottom+'px';
  showHL(f.rect);renderK();
  requestAnimationFrame(()=>{ // 入力欄が見える位置までスクロール
    const pb=kpanel.getBoundingClientRect().bottom, cr=cv.getBoundingClientRect();
    const fy=cr.top+f.rect.y0/H*cr.height, fy2=cr.top+f.rect.y1/H*cr.height, vh=(window.visualViewport?visualViewport.height:innerHeight);
    if(fy<pb+8||fy2>vh-8)window.scrollBy({top:fy-pb-24,behavior:'smooth'});
  });
}
function closeK(){kcommit();kpanel.hidden=true;kcur=-1;hideHL();document.querySelectorAll('.sheetOnly').forEach(e=>e.style.visibility='');if(document.activeElement)document.activeElement.blur();}
function optRow(label,opts,cur,on,small){
  const row=document.createElement('div');row.className='opts';
  if(label){const l=document.createElement('span');l.className='lbl';l.textContent=label;row.appendChild(l);}
  for(const o of opts){const b=document.createElement('button');b.className='opt'+(small?' small':'');b.textContent=o;b.setAttribute('aria-pressed',cur===o);b.onclick=()=>on(cur===o?undefined:o);row.appendChild(b);}
  return row;
}
function advance(){setTimeout(()=>{if(kcur>=0&&kcur<KF.length-1)openK(kcur+1);},220);}
function renderK(){
  const f=KF[kcur],body=$('kBody');body.innerHTML='';
  $('kTitle').innerHTML=`${f.name}${f.sub?`<small>${f.sub}</small>`:''}`;
  $('kPrev').disabled=kcur<=0;$('kNext').disabled=kcur>=KF.length-1;
  const v=vals[f.key];
  if(f.type==='text'){
    const t=document.createElement('textarea');t.id='kText';t.value=v||'';t.rows=f.num?1:2;t.setAttribute('enterkeyhint','next');
    if(f.num)t.setAttribute('inputmode','numeric');
    t.oninput=()=>setVal(f.key,t.value);
    t.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();openK(kcur+1);}};
    body.appendChild(t);
    const h=document.createElement('p');h.className='khint';h.textContent='Apple Pencil でこの枠に手書きすると、iPad のスクリブルで文字に変換されます。改行は Shift＋Enter。';body.appendChild(h);
    setTimeout(()=>{try{t.focus({preventScroll:true});}catch(_){t.focus();}},30);
  }else if(f.type==='date'){
    const inp=document.createElement('input');inp.type='date';inp.id='kDate';
    const d=dateText?new Date(+dateText.y,+dateText.m-1,+dateText.d):new Date();
    inp.value=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const apply=()=>{if(!inp.value){dateText=null;}else{const [y,m,dd]=inp.value.split('-').map(Number);const dt=new Date(y,m-1,dd);dateText={y:String(y),m:String(m),d:String(dd),wd:'日月火水木金土'[dt.getDay()]};}redrawSheet();save();syncDate();};
    inp.onchange=apply;body.appendChild(inp);
    const row=document.createElement('div');row.className='opts';row.style.marginTop='10px';
    const b=document.createElement('button');b.className='opt small';b.textContent='今日にする';b.onclick=()=>{const t=new Date();inp.value=`${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;apply();};
    row.appendChild(b);body.appendChild(row);
  }else if(f.type==='choice'||f.type==='risk'||f.type==='check'){
    body.appendChild(optRow('',f.opts,v,nv=>{setVal(f.key,nv);renderK();if(nv)advance();}));
  }else if(f.type==='health'){
    const cur=v||{};
    const upd=(t,nv)=>{const o=Object.assign({},vals[f.key]||{});if(nv)o[t]=nv;else delete o[t];setVal(f.key,Object.keys(o).length?o:undefined);renderK();const n=vals[f.key]||{};if(n.am&&n.pm)advance();};
    body.appendChild(optRow('AM',['良','不'],cur.am,nv=>upd('am',nv)));
    body.appendChild(optRow('PM',['良','不'],cur.pm,nv=>upd('pm',nv)));
  }
}
$('kPrev').onclick=()=>openK(kcur-1);
$('kNext').onclick=()=>openK(kcur+1);
$('kDone').onclick=closeK;
$('kClear').onclick=()=>{const f=KF[kcur];if(!f)return;if(f.type==='date'){dateText=null;redrawSheet();save();}else setVal(f.key,undefined);renderK();};
$('newBtn').onclick=e=>{const f=MODE==='key'?KF[kcur]:F[fi];if(!f||!f.newKey)return;const prev=snap();if(vals[f.newKey])delete vals[f.newKey];else vals[f.newKey]=true;commit(prev);redrawAll();e.currentTarget.setAttribute('aria-pressed',!!vals[f.newKey]);};
if(MODE==='key'){
  $('hint').textContent='入力する欄をタップすると、上に入力パネルが開きます。文字はキーボードのほか、Apple Pencil で枠に書けばスクリブルで文字に変換されます。昼・夜、リスク評価、健康状態はボタンで選びます。氏名・終業確認のサインと、点検・確認の ✓ は手書きです。記入内容はこの端末に自動で保存されます。';
  $('today').hidden=true;
}

/* ---------- 起動 ---------- */
function todayText(){const d=new Date();return {y:String(d.getFullYear()),m:String(d.getMonth()+1),d:String(d.getDate()),wd:'日月火水木金土'[d.getDay()]};}
load();
if(MODE!=='key'){
  $('today').hidden=true;
  if(!dateText){dateText=todayText();save();}   // 開いた時点で今日の日付を入れる
  width=+$('w1').dataset.w;['w1','w2','w3'].forEach(id=>$(id).setAttribute('aria-pressed',id==='w1'));  // 線はデフォルトで細線
}
ui();syncDate();
new ResizeObserver(()=>resize()).observe(sheet);
window.addEventListener('resize',()=>{if(fi>=0||!pad.hidden)requestAnimationFrame(layoutPad);});
if(window.visualViewport){let t;visualViewport.addEventListener('resize',()=>{clearTimeout(t);t=setTimeout(resize,250);});}
resize();
if(document.fonts){Promise.all([document.fonts.load(`400 12px ${FF}`),document.fonts.load(`700 12px ${FF}`)]).catch(()=>{}).then(()=>{wcache.clear();redrawAll();});document.fonts.ready.then(()=>{wcache.clear();redrawAll();});}
status(strokes.length?'前回の記入を読み込みました':'');
})();
</script>
